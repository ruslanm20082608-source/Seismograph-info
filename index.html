<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG24 life — Онлайн Сейсмограф и Спектрограмма</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111920; 
            color: #627382;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
            flex-shrink: 0;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }
        #status {
            font-size: 0.8rem;
            font-weight: 500;
            color: #ffa500;
            background: rgba(255, 165, 0, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
            max-width: 60%;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
        .panels-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            height: calc(100% - 45px);
        }
        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #111920;
            border: 1px solid #1c2730;
            border-radius: 8px;
            overflow: hidden;
        }
        .panel-label {
            position: absolute;
            top: 8px;
            left: 75px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #2ecd71;
            background: rgba(46, 205, 113, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SG24 life</div>
        <div id="status">🟠 ПОДКЛЮЧЕНИЕ К СЕЙСМОСТАНЦИИ...</div>
    </header>

    <div class="panels-container">
        <div class="canvas-container">
            <div class="panel-label">LIVE ОСЦИЛЛОГРАММА (ЗЕРКАЛЬНАЯ)</div>
            <canvas id="seismicCanvas"></canvas>
        </div>
        
        <div class="canvas-container">
            <div class="panel-label" style="color: #ff9f43; background: rgba(255, 159, 67, 0.1);">СПЕКТРАЛЬНЫЙ АНАЛИЗ (FFT)</div>
            <canvas id="spectrogramCanvas"></canvas>
        </div>
    </div>

<script>
// --- ОСНОВНЫЕ НАСТРОЙКИ СТАНЦИИ ---
const SAMPLING_RATE = 50;      // Частота дискретизации твоего ESP32 в Гц
const FFT_SIZE = 128;          // Окно анализа (64, 128 или 256)
const VISUAL_SENSITIVITY = 25; // Чувствительность спектрограммы (чем меньше число, тем ярче цвета при шуме)
const totalLines = 6;          // Количество строк на верхнем барабане
const maxAmplitude = 10;       // Максимальная амплитуда по оси Y
const speed = 2;               // Скорость движения графиков

// --- ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ---
const statusText = document.getElementById("status");
const seismicCanvas = document.getElementById("seismicCanvas");
const sCtx = seismicCanvas.getContext("2d");
const spectrogramCanvas = document.getElementById("spectrogramCanvas");
const spCtx = spectrogramCanvas.getContext("2d");

let lineSpacing = 0;
let currentLineIdx = 0;
let currentX = 0;
let lastYTop = 0;
let lastYBottom = 0;
let rawBuffer = [];            
let specX = 70;                

// Жесткая принудительная инициализация размеров
function resizeCanvases() {
    const dpr = window.devicePixelRatio || 1;
    
    // Получаем реальные размеры блоков пикселей в браузере
    const sWidth = seismicCanvas.clientWidth;
    const sHeight = seismicCanvas.clientHeight;
    const spWidth = spectrogramCanvas.clientWidth;
    const spHeight = spectrogramCanvas.clientHeight;

    // Задаем физический размер внутренних матриц пикселей холста
    seismicCanvas.width = sWidth * dpr;
    seismicCanvas.height = sHeight * dpr;
    spectrogramCanvas.width = spWidth * dpr;
    spectrogramCanvas.height = spHeight * dpr;

    lineSpacing = seismicCanvas.height / (totalLines + 1);
    specX = 70 * dpr;

    drawSeismicBackground();
    drawSpectrogramBackground();

    // Сброс позиций перьев
    const startX = 70 * dpr;
    if (currentX < startX || currentX > seismicCanvas.width) {
        currentX = startX;
    }
    lastYTop = (currentLineIdx + 1) * lineSpacing;
    lastYBottom = lastYTop;
}

function drawSeismicBackground() {
    const dpr = window.devicePixelRatio || 1;
    sCtx.fillStyle = "#111920";
    sCtx.fillRect(0, 0, seismicCanvas.width, seismicCanvas.height);
    
    sCtx.strokeStyle = "#1c2730";
    sCtx.lineWidth = 1 * dpr;
    
    for (let i = 1; i <= totalLines; i++) {
        sCtx.beginPath();
        sCtx.moveTo(70 * dpr, i * lineSpacing);
        sCtx.lineTo(seismicCanvas.width, i * lineSpacing);
        sCtx.stroke();
    }
    
    sCtx.fillStyle = "#415161";
    sCtx.font = `${10 * dpr}px monospace`;
    for (let i = 1; i <= totalLines; i += 2) {
        sCtx.fillText(`+${maxAmplitude}`, 15 * dpr, (i * lineSpacing) - lineSpacing * 0.25);
        sCtx.fillText(`0`, 15 * dpr, (i * lineSpacing) + 3 * dpr);
        sCtx.fillText(`-${maxAmplitude}`, 15 * dpr, (i * lineSpacing) + lineSpacing * 0.3);
    }
}

function drawSpectrogramBackground() {
    const dpr = window.devicePixelRatio || 1;
    spCtx.fillStyle = "#111920";
    spCtx.fillRect(0, 0, spectrogramCanvas.width, spectrogramCanvas.height);
    
    const maxFreq = SAMPLING_RATE / 2;
    spCtx.fillStyle = "#415161";
    spCtx.font = `${10 * dpr}px monospace`;
    
    const steps = 4;
    const startX = 70 * dpr;
    const bottomOffset = 20 * dpr;
    const availableHeight = spectrogramCanvas.height - bottomOffset - 10 * dpr;
    
    for(let i = 0; i <= steps; i++) {
        const freq = (maxFreq * (i / steps)).toFixed(1);
        const y = spectrogramCanvas.height - bottomOffset - (i * (availableHeight / steps));
        
        spCtx.fillText(`${freq} Гц`, 15 * dpr, y + 4 * dpr);
        
        spCtx.strokeStyle = "#1c2730";
        spCtx.beginPath();
        spCtx.moveTo(startX, y);
        spCtx.lineTo(spectrogramCanvas.width, y);
        spCtx.stroke();
    }
}

function clearAhead(ctx, x, lineIdx) {
    const dpr = window.devicePixelRatio || 1;
    const yCenter = (lineIdx + 1) * lineSpacing;
    ctx.fillStyle = "#111920";
    ctx.fillRect(x, yCenter - lineSpacing/2, 35 * dpr, lineSpacing - 2);
}

// --- РЕАЛИЗАЦИЯ МАТЕМАТИКИ БПФ ---
function computeFFT(amplitudes) {
    const N = amplitudes.length;
    if (N <= 1) return amplitudes;

    const real = new Float32Array(N);
    const imag = new Float32Array(N);
    
    for (let i = 0; i < N; i++) {
        const windowValue = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (N - 1)));
        real[i] = amplitudes[i] * windowValue;
    }

    function fftRecursive(r, j) {
        const n = r.length;
        if (n <= 1) return;

        const rEven = new Float32Array(n / 2);
        const jEven = new Float32Array(n / 2);
        const rOdd = new Float32Array(n / 2);
        const jOdd = new Float32Array(n / 2);

        for (let i = 0; i < n / 2; i++) {
            rEven[i] = r[2 * i];
            jEven[i] = j[2 * i];
            rOdd[i] = r[2 * i + 1];
            jOdd[i] = j[2 * i + 1];
        }

        fftRecursive(rEven, jEven);
        fftRecursive(rOdd, jOdd);

        for (let k = 0; k < n / 2; k++) {
            const th = -2 * Math.PI * k / n;
            const wReal = Math.cos(th);
            const wImag = Math.sin(th);

            const tReal = rOdd[k] * wReal - jOdd[k] * wImag;
            const tImag = rOdd[k] * wImag + jOdd[k] * wReal;

            r[k] = rEven[k] + tReal;
            j[k] = jEven[k] + tImag;
            r[k] + n / 2] = rEven[k] - tReal;
            j[k] + n / 2] = jEven[k] - tImag;
        }
    }

    fftRecursive(real, imag);

    const magnitudes = new Float32Array(N / 2);
    for (let i = 0; i < N / 2; i++) {
        magnitudes[i] = Math.sqrt(real[i] * real[i] + imag[i] * imag[i]);
    }
    return magnitudes;
}

function getColorForIntensity(value) {
    const v = Math.max(0, Math.min(1, value));
    const r = Math.floor(Math.max(0, (v - 0.15) * 4.5) * 255);
    const g = Math.floor(Math.max(0, (v - 0.45) * 3.5) * 255);
    const b = Math.floor(Math.min(1, v * 2.5) * 110 + Math.max(0, (v - 0.65) * 4) * 145);
    return `rgb(${r}, ${g}, ${b})`;
}

// --- НАСТРОЙКИ MQTT БРОКЕРА ---
const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";
const topic = "esp32s3/seismic/geophone";

const options = {
    connectTimeout: 8000, // Увеличили таймаут для мобилок
    clientId: 'SG24_Life_Full_Station_' + Math.random().toString(16).substr(2, 8),
    keepalive: 60,
    clean: true
};

const client = mqtt.connect(brokerUrl, options);
let smoothedValue = 0;
const k = 0.3; 

client.on('connect', () => {
    statusText.innerText = "🟢 ОНЛАЙН — Идет запись спектра и волн...";
    statusText.style.color = "#2ecd71";
    statusText.style.background = "rgba(46, 205, 113, 0.1)";
    client.subscribe(topic);
});

client.on('message', (receivedTopic, topicMessage) => {
    const rawValue = parseFloat(topicMessage.toString());
    const dpr = window.devicePixelRatio || 1;
    
    if (!isNaN(rawValue)) {
        smoothedValue = smoothedValue + k * (rawValue - smoothedValue);
        
        rawBuffer.push(smoothedValue);
        if (rawBuffer.length > FFT_SIZE) {
            rawBuffer.shift();
        }

        const startX = 70 * dpr;
        if (currentX < startX) currentX = startX;

        const yCenter = (currentLineIdx + 1) * lineSpacing;
        const dynamicScale = (lineSpacing * 0.45) / maxAmplitude;
        
        const offset = smoothedValue * dynamicScale;
        const nextYTop = yCenter - offset;
        const nextYBottom = yCenter + offset; 

        clearAhead(sCtx, currentX, currentLineIdx);

        // Отрисовка волны
        sCtx.beginPath();
        sCtx.strokeStyle = "rgba(255, 83, 118, 0.9)"; 
        sCtx.lineWidth = 1.2 * dpr;
        sCtx.lineJoin = "round";
        sCtx.lineCap = "round";
        
        sCtx.moveTo(currentX, lastYTop);
        sCtx.lineTo(currentX + (speed * dpr), nextYTop);
        sCtx.moveTo(currentX, lastYBottom);
        sCtx.lineTo(currentX + (speed * dpr), nextYBottom);
        sCtx.stroke();

        // Заполнение межрадиального пространства
        sCtx.beginPath();
        sCtx.strokeStyle = "rgba(255, 83, 118, 0.15)";
        sCtx.moveTo(currentX + (speed * dpr), nextYTop);
        sCtx.lineTo(currentX + (speed * dpr), nextYBottom);
        sCtx.stroke();

        currentX += (speed * dpr);
        lastYTop = nextYTop;
        lastYBottom = nextYBottom;

        if (currentX >= seismicCanvas.width - 5 * dpr) {
            currentX = startX;
            currentLineIdx++;
            if (currentLineIdx >= totalLines) {
                currentLineIdx = 0;
                drawSeismicBackground();
            }
            lastYTop = (currentLineIdx + 1) * lineSpacing;
            lastYBottom = lastYTop;
        }

        // Отрисовка спектрограммы
        if (rawBuffer.length === FFT_SIZE) {
            const spectrum = computeFFT(rawBuffer);
            const numBins = spectrum.length;
            
            const bottomOffset = 20 * dpr;
            const graphHeight = spectrogramCanvas.height - bottomOffset - 10 * dpr;
            const binHeight = graphHeight / numBins;
            
            spCtx.fillStyle = "#111920";
            spCtx.fillRect(specX, 0, (speed * dpr) + 2 * dpr, spectrogramCanvas.height - bottomOffset);

            for (let i = 0; i < numBins; i++) {
                const intensity = spectrum[i] / VISUAL_SENSITIVITY; 
                spCtx.fillStyle = getColorForIntensity(intensity);
                
                const y = spectrogramCanvas.height - bottomOffset - (i * binHeight);
                spCtx.fillRect(specX, y - binHeight, (speed * dpr), binHeight + 0.5 * dpr);
            }

            specX += (speed * dpr);
            
            if (specX >= spectrogramCanvas.width - 5 * dpr) {
                specX = startX;
                drawSpectrogramBackground();
            }
        }
    }
});

client.on('offline', () => {
    statusText.innerText = "🟠 ОФФЛАЙН — Переподключение...";
    statusText.style.color = "#ffa500";
    statusText.style.background = "rgba(255, 165, 0, 0.1)";
});

// Безопасный запуск после полной прогрузки DOM и дерева стилей
window.addEventListener('resize', resizeCanvases);
window.onload = () => {
    setTimeout(resizeCanvases, 150);
};
</script>

</body>
</html>
