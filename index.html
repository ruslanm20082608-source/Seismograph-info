<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Онлайн Сейсмограф</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f5;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #4caf50; }
        #status {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            color: #ffa500;
        }
        .chart-container {
            position: relative;
            margin: auto;
            height: 40vh;
            width: 80vw;
            background: #2a2a32;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>🌋 Мониторинг сейсмической активности</h1>
    <div id="status">🟠 Подключение к брокеру...</div>

    <div class="chart-container">
        <canvas id="seismicChart"></canvas>
    </div>

<script>
const statusText = document.getElementById("status");

// --- Настройки подключения к HiveMQ WebSockets ---
const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";
const topic = "esp32s3/seismic/geophone";

const client = mqtt.connect(brokerUrl);

// --- Настройка графика Chart.js ---
const ctx = document.getElementById('seismicChart').getContext('2d');
const maxDataPoints = 100; // Сколько точек одновременно отображать на экране

const seismicChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: Array(maxDataPoints).fill(""), // Пустые метки времени для плавности
        datasets: [{
            label: 'Сигнал геофона (Разность АЦП x16)',
            data: Array(maxDataPoints).fill(0),
            borderColor: '#4caf50',
            borderWidth: 2,
            pointRadius: 0, // Убираем точки, оставляем только линию
            fill: false,
            tension: 0.2 // Легкое сглаживание линии
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
            y: {
                grid: { color: '#3a3a42' },
                ticks: { color: '#b5b5b5' },
                // Автоматическое масштабирование, чтобы линия «дышала» при ударе
                suggestedMin: -500,
                suggestedMax: 500
            },
            x: { display: false } // Прячем нижнюю ось
        },
        plugins: {
            legend: { labels: { color: '#fff' } }
        }
    }
});

// --- Обработка событий MQTT ---
client.on('connect', () => {
    statusText.innerText = "🟢 ПОДКЛЮЧЕНО. Ожидание данных...";
    statusText.style.color = "#4caf50";
    client.subscribe(topic);
});

client.on('message', (receivedTopic, topicMessage) => {
    // Получаем число из ESP32-S3
    const value = parseInt(topicMessage.toString());
    
    if (!isNaN(value)) {
        statusText.innerText = "📡 VALUE: " + value;
        statusText.style.color = "#4caf50";

        // Сдвигаем график влево (удаляем старую точку, добавляем новую)
        seismicChart.data.datasets[0].data.shift();
        seismicChart.data.datasets[0].data.push(value);
        seismicChart.update('none'); // Быстрое обновление без анимации задержки
    }
});

client.on('error', (err) => {
    statusText.innerText = "❌ ERROR: " + err;
    statusText.style.color = "#ff4444";
});

client.on('offline', () => {
    statusText.innerText = "🟠 OFFLINE - reconnecting...";
    statusText.style.color = "#ffa500";
});
</script>

</body>
</html>
