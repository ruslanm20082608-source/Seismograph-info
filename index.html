        <canvas id="seismicCanvas"></canvas>
    </div>

<script>

const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

function resizeCanvas() {
    canvas.width = canvas.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.clientHeight * window.devicePixelRatio;
    drawSeismograph();
}

// --- НАСТРОЙКИ КЛАССИЧЕСКОЙ СЕЙСМОГРАММЫ ---
const numLines = 8;             
const pointsPerLine = 400;      
const totalPoints = numLines * pointsPerLine;

let currentIndex = 0;           
const maxAmplitude = 50;        

function drawSeismograph() {
    ctx.fillStyle = "#111920";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const paddingLeft = 70 * window.devicePixelRatio;
    const paddingRight = 20 * window.devicePixelRatio;
    const graphWidth = canvas.width - paddingLeft - paddingRight;
    const graphHeight = canvas.height;
    const rowHeight = graphHeight / (numLines + 1);

    ctx.lineWidth = 1 * window.devicePixelRatio;
    ctx.font = `${11 * window.devicePixelRatio}px monospace`;

    for (let r = 0; r < numLines; r++) {
        let yCenter = rowHeight * (r + 1);

        ctx.strokeStyle = "#1c2730";
        ctx.beginPath();
        ctx.moveTo(paddingLeft, yCenter);
        ctx.lineTo(canvas.width - paddingRight, yCenter);
        ctx.stroke();

        if (r === 0 || r === Math.floor(numLines / 2)) {
            ctx.fillStyle = "#415161";
            ctx.fillText(`+${maxAmplitude}`, paddingLeft - 55 * window.devicePixelRatio, yCenter - rowHeight * 0.3);
            ctx.fillText(`0 мм/с²`, paddingLeft - 55 * window.devicePixelRatio, yCenter + 4 * window.devicePixelRatio);
            ctx.fillText(`-${maxAmplitude}`, paddingLeft - 55 * window.devicePixelRatio, yCenter + rowHeight * 0.3);
        }

        if (r === numLines - 1) {
            ctx.fillStyle = "#627382";
            const totalSeconds = 30; 
            for (let s = 0; s <= 4; s++) {
                let x = paddingLeft + (graphWidth * (s / 4));
                let secLabel = ((s / 4) * totalSeconds).toFixed(0) + "с";
                ctx.fillText(secLabel, x - 10 * window.devicePixelRatio, yCenter + rowHeight * 0.5);
                
                ctx.strokeStyle = "#415161";
                ctx.beginPath();
                ctx.moveTo(x, yCenter + rowHeight * 0.1);
                ctx.lineTo(x, yCenter + rowHeight * 0.25);
                ctx.stroke();
            }
        }
    }

    ctx.lineCap = "round";

        let age = (currentWritingRow - r + numLines) % numLines;
