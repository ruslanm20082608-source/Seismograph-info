<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Сейсмограф</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111920; /* Темно-синий фон из скриншота */
            color: #627382;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        #status {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #2ecd71;
        }
        .canvas-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: #111920;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="status">🟢 ПОДКЛЮЧЕНИЕ К СЕТИ...</div>

    <div class="canvas-container">
        <canvas id="seismicCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById("seismicCanvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

// Автоматическая подстройка разрешения холста под размер экрана
function resizeCanvas() {
    canvas.width = canvas.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.clientHeight * window.devicePixelRatio;
    drawSeismograph();
}

// --- НАСТРОЙКИ ГРАФИКА ---
const maxPoints = 500;         // Плотность точек на экране
let dataHistory = Array(maxPoints).fill(0);

// Высокая чувствительность, чтобы линия не казалась прямой
const maxAmplitude = 60;       

function drawSeismograph() {
    const yCenter = canvas.height / 2;

    // Очистка фона
    ctx.fillStyle = "#111920";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Рисуем горизонтальные линии шкалы (10, 5, 0, -5, -10)
    const linePositions = [0.15, 0.325, 0.5, 0.675, 0.85];
    const labels = ["10", "5", "0", "-5", "-10"];
    
    ctx.strokeStyle = "#1c2730";
    ctx.lineWidth = window.devicePixelRatio;
    ctx.font = `${14 * window.devicePixelRatio}px sans-serif`;
    ctx.fillStyle = "#627382";

    linePositions.forEach((pos, idx) => {
        let y = canvas.height * pos;
        ctx.beginPath();
        ctx.moveTo(60 * window.devicePixelRatio, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
        
        // Цифры шкалы слева
        ctx.fillText(labels[idx], 15 * window.devicePixelRatio, y + (5 * window.devicePixelRatio));
    });

    // Рисуем РОЗОВУЮ сейсмическую линию (вид как на скрине)
    ctx.beginPath();
    ctx.strokeStyle = "#ff5376"; // Розовый цвет трека
    ctx.lineWidth = 2 * window.devicePixelRatio;
    ctx.lineJoin = "round";

    const startX = 60 * window.devicePixelRatio;
    const stepX = (canvas.width - startX) / (maxPoints - 1);
    
    for (let i = 0; i < maxPoints; i++) {
        let x = startX + i * stepX;
        let val = dataHistory[i];
        
        // Масштабирование под холст
        let y = yCenter - (val / maxAmplitude) * (canvas.height * 0.35);
        
        // Ограничители по краям шкалы
        if (y < canvas.height * 0.12) y = canvas.height * 0.12;
        if (y > canvas.height * 0.88) y = canvas.height * 0.88;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.stroke();
}

// --- НАСТРОЙКИ MQTT ---
const brokerUrl = "wss://broker.hivemq.com:443/mqtt"; // Стабильный порт 443
const topic = "esp32s3/seismic/geophone";
const client = mqtt.connect(brokerUrl);

let smoothedValue = 0;
const k = 0.4; // Коэффициент фильтрации шума

client.on('connect', () => {
    statusText.innerText = "🟢 ОНЛАЙН — Прием сейсмограммы...";
    statusText.style.color = "#2ecd71";
    client.subscribe(topic);
});

client.on('message', (receivedTopic, topicMessage) => {
    const rawValue = parseInt(topicMessage.toString());
    
    if (!isNaN(rawValue)) {
        smoothedValue = smoothedValue + k * (rawValue - smoothedValue);

        // Сдвиг данных влево
        dataHistory.shift();
        dataHistory.push(smoothedValue);

        // Перерисовка графика
        drawSeismograph();
    }
});

client.on('offline', () => {
    statusText.innerText = "🟠 ОФФЛАЙН — Потеря связи с брокером";
    statusText.style.color = "#ffa500";
});

// Следим за изменением размеров окна браузера
window.addEventListener('resize', resizeCanvas);
window.onload = resizeCanvas;
</script>

</body>
</html>
